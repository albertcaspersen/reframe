<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logo/LOGO3.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ReFrame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    <script>
      // OpenCV.js will call this when it's ready
      var Module = {
        onRuntimeInitialized: function() {
          window._cvReady = true
          window.dispatchEvent(new Event('opencv-ready'))
        }
      }
    </script>
    <script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #app {
        width: 393px;
        max-width: 393px;
        height: 852px;
        max-height: 852px;
        position: relative;
        overflow: hidden;
        background: #fff;
        transform: translate(0);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
